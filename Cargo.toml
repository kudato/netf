[package]
name = "netf"
version = "0.0.1"
edition = "2024"
rust-version = "1.98.1"
authors = ["Aleksander Shevchenko <kudato@me.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kudato/netf"
readme = "README.md"
description = "Networks of the internet: BGP routes, registries and DNS, queried with KQL"
categories = ["command-line-utilities", "network-programming"]
keywords = ["bgp", "rdap", "whois", "ipset", "kql"]

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "signal"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "client-proxy", "http1", "tokio"] }
# Without default features: no aws-lc-rs and no native certificates.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
http = "1"
# Already used by hyper; formats source retrieval times in UTC.
httpdate = "1"
http-body-util = "0.1"
bytes = "1"
# Already in the dependency tree through hyper-util. `FuturesOrdered` and
# `FuturesUnordered` need `alloc`, which hyper-util does not enable.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# The default rust_backend (miniz_oxide): no C code.
flate2 = "1"
lexopt = "0.3"
crossterm = "0.29"
# Terminal column widths and wrapping without splitting combining sequences.
unicode-width = { version = "0.2", default-features = false }
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
memmap2 = "0.9"
# Directory modes (0700) and owner checks.
libc = "0.2"

[dev-dependencies]
# The stub server for the tests of the HTTP layer. It is never in the binary.
hyper = { version = "1", features = ["server"] }
tokio = { version = "1", features = ["io-util", "test-util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Optimized dependencies keep TLS and gzip fast in tests.
[profile.dev.package."*"]
opt-level = 2

[lints.rust]
missing_docs = "warn"
unsafe_code = "warn"
unreachable_pub = "warn"

[lints.clippy]
mod_module_files = "warn"
